services:
  telegram-forwarder:
    container_name: telegram-forwarder
    image: telegram-forwarder-bot
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - CHAT_LIST_PATH=/app/config/chat_list.json
    volumes:
      - ./config:/app/config
